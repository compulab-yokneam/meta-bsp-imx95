# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-bsp-imx95"
BBFILE_PATTERN_meta-bsp-imx95 = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-bsp-imx95 = "6"

LAYERDEPENDS_meta-bsp-imx95 = "core"
LAYERSERIES_COMPAT_meta-bsp-imx95 = "walnascar"

CORE_IMAGE_EXTRA_INSTALL += " kernel-modules "
CORE_IMAGE_EXTRA_INSTALL += " firmware-onsemi "

BBMASK += "bt-start_1.0.bb"
BBMASK += "meta-compulab/recipes-graphics/wayland"
BBMASK += "u-boot-fw-utils_%.bbappend"
BBMASK += "linux-firmware_git.bbappend"
BBMASK += "xfce4-power-manager_%.bbappend nxp-wlan-sdk_%.bbappend nxp-wlan-sdk_git.bbappend"

HOSTTOOLS += " rsync "

ERROR_QA:remove = "patch-status"
